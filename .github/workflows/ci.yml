name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixtrack
          POSTGRES_PASSWORD: fixtrack
          POSTGRES_DB: fixtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixtrack -d fixtrack_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://fixtrack:fixtrack@localhost:5432/fixtrack_test
      JWT_SECRET: ci-only-secret-not-for-production-123456789012345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
      - run: python -m alembic downgrade base
      - run: python -m alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
